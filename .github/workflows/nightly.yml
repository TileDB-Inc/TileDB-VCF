name: Nightly
# High-level notes:
# * Installs libtiledb and libtiledbvcf into ./install/
# * Manually updates library path so that tiledbvcf-py can link to
#   the shared objects in ./install/
on:
  push:
    paths:
      - '.github/workflows/nightly.yml'
      - 'ci/nightly/**'
  pull_request:
    paths:
      - '.github/workflows/nightly.yml'
      - 'ci/nightly/**'
  schedule:
    - cron: "0 3 * * 1" # Monday 3 AM UTC (Sunday 10 PM EST; 11 PM EDT)
  workflow_dispatch:
jobs:
  nightly:
    runs-on: ${{ matrix.os }}
    # Name includes tiledb-py so the diagnostic cross leg below is distinguishable.
    name: ${{ matrix.os }}-libtiledb-${{ matrix.branches.libtiledb }}-py-${{ matrix.branches.tiledb-py }}
    # A stalled leg has burned ~2.5h of 10x-billed macOS time twice; cap it.
    # Budget: ~35m builds + 10m read diagnostic + 20m pytest timeout + slack.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
        branches:
          - {libtiledb: release-2.30, tiledb-py: 0.36.1}
          - {libtiledb: main, tiledb-py: main}
        include:
          # DIAGNOSTIC LEG: the two matrix legs above vary libtiledb *and*
          # tiledb-py together, so the macOS stall cannot be attributed to
          # either. This crosses them. If this leg is fast, tiledb-py is
          # implicated; if it stalls, libtiledb is. Remove once answered.
          - os: macos-15
            branches: {libtiledb: main, tiledb-py: 0.36.1}
    env:
      MACOSX_DEPLOYMENT_TARGET: 10.15
      # The macOS legs spent 192s (libtiledb 2.30.1) to >300s (2.31.0) inside a
      # single tiledbvcf.Dataset() open. Stack samples show why: the AWS
      # credential chain reaches InstanceProfileCredentialsProvider, which
      # probes the EC2 instance metadata service at 169.254.169.254. These
      # runners are not EC2, and on macOS that probe blocks until timeout rather
      # than failing fast as it does on Linux -- where the same frames never
      # appear at all. It happens while holding the S3::init_client() mutex, so
      # every other thread piles up behind it.
      #
      # Telling the SDK it is not on EC2 skips that provider outright. The
      # bucket read by test_large_export_correctness is public, so there are no
      # instance credentials to find in the first place. TileDB's credential
      # chain honours this variable in both 2.30.x and 2.31.0
      # (tiledb/sm/filesystem/s3/AWSCredentialsProviderChain.cc).
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - name: Clone TileDB
        uses: actions/checkout@v6
        with:
          repository: TileDB-Inc/TileDB
          ref: ${{ matrix.branches.libtiledb }}
          path: TileDB
      - name: Clone TileDB-Py
        uses: actions/checkout@v6
        with:
          repository: TileDB-Inc/TileDB-Py
          ref: ${{ matrix.branches.tiledb-py }}
          path: TileDB-Py
      - name: Clone TileDB-VCF
        uses: actions/checkout@v6
        with:
          path: TileDB-VCF
          fetch-depth: 0 # fetch everything for python setuptools_scm
      - name: Define SDKROOT (macOS)
        if: runner.os == 'macOS'
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV
      # DIAGNOSTIC: records the runner's raw S3 latency, which is the baseline
      # any read-time comparison between legs must be read against. Remove with
      # the rest of the stall diagnostics.
      - name: Probe runner and S3 baseline latency
        run: bash TileDB-VCF/ci/nightly/probe-s3.sh
      - name: Build libtiledb
        run: bash TileDB-VCF/ci/nightly/build-libtiledb.sh
      - name: Setup to build htslib from source (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes automake autoconf libbz2-dev liblzma-dev
      - name: Setup to build htslib from source (macOS)
        if: runner.os == 'macOS'
        run: brew install autoconf automake
      - name: Build libtiledbvcf
        run: bash TileDB-VCF/ci/nightly/build-libtiledbvcf.sh
      - name: Confirm linking (Linux)
        if: runner.os == 'Linux'
        run: |
          ldd install/lib/libtiledb.so
          ldd install/lib/libtiledbvcf.so
      - name: Confirm linking (macOS)
        if: runner.os == 'macOS'
        run: |
          otool -L install/lib/libtiledb.dylib
          otool -L install/lib/libtiledbvcf.dylib
      - name: Install bcftools (for tests) (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install --yes bcftools
      - name: Install bcftools (for tests) (macOS)
        if: runner.os == 'macOS'
        run: brew install bcftools
      - name: Test libtiledbvcf
        run: bash TileDB-VCF/ci/nightly/test-libtiledbvcf.sh
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Build tiledb-py from source
        run: bash TileDB-VCF/ci/nightly/build-tiledb-py.sh
        env:
          PYBIND11_MAX_VERSION: ${{ matrix.branches.tiledb-py != 'main' && '<3' || '' }}
      - name: Build (and test) tiledbvcf-py
        run: bash TileDB-VCF/ci/nightly/build-tiledbvcf-py.sh
      # DIAGNOSTIC: the stack samples and per-size read timings are large and
      # get truncated in the web log, so keep them as an artifact. Runs even
      # when pytest fails on its timeout, which is the case we care about.
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.os }}-libtiledb-${{ matrix.branches.libtiledb }}-py-${{ matrix.branches.tiledb-py }}
          path: diagnostics/*
          retention-days: 14
          if-no-files-found: warn
  issue:
    permissions:
      issues: write
    runs-on: ubuntu-latest
    needs: nightly
    if: ( failure() || cancelled() ) && github.repository_owner == 'TileDB-Inc' && github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v6
      - name: Open Issue
        uses: TileDB-Inc/github-actions/open-issue@main
        with:
          name: nightly build
          label: nightly-failure
          assignee: alancleary,ihnorton,Shelnutt2,jdblischak
        env:
          TZ: "America/New_York"
